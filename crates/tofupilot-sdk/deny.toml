# cargo-deny configuration for the Rust SDK.
#
# The SDK resolves its own lockfile and publishes to crates.io independently of
# the CLI, so it is gated on its own advisories rather than inheriting the
# CLI's (see .github/workflows/security-audit.yml).

[advisories]
version = 2
# Fail on any security vulnerability. `unmaintained` advisories that we cannot
# action (transitive, no upstream fix yet) belong here explicitly so a NEW
# unmaintained crate still trips the gate.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with publishing an MIT crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
