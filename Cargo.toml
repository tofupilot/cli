[package]
name = "tofupilot"
version = "1.6.0"
edition = "2021"
rust-version = "1.85"
description = "TofuPilot CLI: run, deploy, and manage test procedures from the terminal."
license = "MIT"
authors = ["TofuPilot <hello@tofupilot.com>"]
repository = "https://github.com/tofupilot/cli"
homepage = "https://tofupilot.com"
readme = "README.md"
keywords = ["tofupilot", "testing", "manufacturing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "tofupilot"
path = "src/main.rs"

[features]
default = ["realtime-native-roots", "reqwest-no-provider"]
# Aliases onto the shared tokio-tungstenite node so `src/http.rs` can assert
# the realtime TLS stack at compile time. Enabling the dependency feature here
# is what makes it observable as a `cfg` in our own crate.
realtime-native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
# reqwest must stay on `rustls-no-provider`: the plain `rustls` feature pulls
# aws-lc-rs (C toolchain, no static musl) and routes verification through
# rustls-platform-verifier, which on Linux trusts the OS store alone. `http.rs`
# feeds it an explicit root store instead, and asserts this feature is on.
reqwest-no-provider = ["reqwest/rustls-no-provider"]

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BOTH root sets, to match the realtime WebSocket exactly. `rustls-tls` alone
# resolves to webpki roots only; `rustls-tls-native-roots` alone swaps them for
# the OS store. reqwest tracks the two independently
# (`tls_built_in_certs_webpki` / `..._native`), so enabling both gives HTTP the
# same trust the WebSocket has. Leaving them asymmetric means a machine-wide
# corporate CA brings the station "online" while every upload fails — or a
# broken system store breaks the public cloud.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "stream"] }
# Direct dep so the update retry can downcast `reqwest::Error` sources to
# `hyper::Error` and detect a mid-stream "connection closed before message
# completed" reset. Load-bearing invariant: this MUST resolve to the SAME
# hyper node reqwest links (today both are 1.9.0). `"1"` is a range, not a
# pin — if a future reqwest bump ever splits hyper into two majors, the
# downcast silently returns None and the stream retry stops firing. Keep them
# unified; see `is_transient_stream` in commands/update/download.rs.
hyper = "1"
directories = "6"
tofupilot-sdk = { package = "tofupilot", path = "crates/tofupilot-sdk" }
self-replace = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
open = "5"
comfy-table = "7"
semver = "1"
redb = "4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
ignore = "0.4"
tempfile = "3"
command-group = { version = "5.0", features = ["with-tokio"] }
station-protocol = { path = "crates/station-protocol" }
execution-engine = { path = "crates/execution-engine" }
async-trait = "0.1"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
# Pinned to our fork for `ClientConfig::connector`, which lets the realtime
# WebSocket trust the CA file passed to `tofupilot login --ca-cert` instead of
# only the roots baked into the build. Upstream has no such hook (it calls
# `connect_async`, which takes no connector), so without this the flag would
# cover HTTP but not the realtime link. PR is open upstream; drop the `git`
# pin for a plain version once it lands in a release.
# `rev`, not `branch`: a branch pin follows force-pushes, so the build could
# change under us without a lockfile diff to review.
centrifuge-client = { git = "https://github.com/tofupilot/centrifuge-rs", rev = "45c2e82bff5c5599ad99725802310c83899cce5c", default-features = false, features = ["rustls"] }
# Not used directly — exists only to turn on `rustls-tls-native-roots` inside
# centrifuge-client's tokio-tungstenite via cargo feature unification, so the
# realtime WebSocket trusts the OS certificate store in addition to the bundled
# Mozilla roots. This is what lets a self-hosted station behind a private CA
# (installed machine-wide) open the realtime link; HTTP gets the same CA through
# `http.rs`. On Linux the loader is `openssl-probe` (filesystem path probing
# only, no OpenSSL linking) so static musl builds are unaffected. Load-bearing
# invariant: the version MUST resolve to the SAME tokio-tungstenite node
# centrifuge-client links (today both are 0.29) — if they ever split into two
# majors, unification stops and the OS store silently drops out of the trust
# path. On bumps, `cargo tree -i tokio-tungstenite@<ver>` must show
# centrifuge-client and tofupilot sharing one node. (axum pulls its own older
# tokio-tungstenite for the local ws server — separate node, no TLS client,
# irrelevant here.)
#
# Second invariant: `native-tls` must stay OFF on that node. tokio-tungstenite
# picks the default connector with `cfg(all(__rustls-tls, not(native-tls)))`,
# so any dependency enabling `native-tls` silently wins the connector, links
# OpenSSL (breaking static musl) and drops the rustls root store configured
# here. `realtime_tls_stack_is_rustls_with_native_roots` in src/http.rs fails
# the build's test run if that ever happens.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
# Build the realtime connector that carries the `--ca-cert` bundle. Features
# must MATCH what tokio-tungstenite already resolves (`ring`, no aws-lc): a
# second crypto provider would both bloat the binary and fail the musl builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
ratatui = "0.30"
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
sysinfo = "0.32"
mac_address = "1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
include_dir = "0.7"
mime_guess = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Native folder picker for `pick_project` (local_ws/studio.rs) — the one
# studio op that can grant a NEW root, via a window the web page cannot
# drive. macOS/Windows backends are unconditional; on Linux only
# `xdg-portal` (pure Rust — rfd 0.17 drives the portal itself over
# `pollster`; no ashpd, no zbus in the lockfile) is enabled: the default `wayland`
# feature links the system libwayland C library and would break the
# static musl release targets. It is only for parenting the dialog to a
# Wayland window, and a daemon has no window.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Delete in the Code sidebar goes to the OS trash, not `unlink`: a
# mis-click on someone's procedure has to be recoverable from the
# Finder. Dependency tree verified against the musl target — chrono,
# libc, urlencoding, percent-encoding, all pure Rust, no dbus/zbus and
# nothing linking C, so the static Linux release builds are unaffected
# (macOS goes through objc2/Foundation, already in the tree via rfd).
# NOT verified: the Windows path, which pulls windows 0.56 — a fourth
# major of that family into this lockfile (0.56/0.57/0.58/0.61). Cost
# is compile time on the Windows release job, not runtime; consolidate
# when the ecosystem converges rather than pinning against it here.
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust sd_notify(3). Used to ping the systemd watchdog when the
# CLI runs as a `tofupilot.service` user unit with `WatchdogSec` set.
# No-op outside systemd (the helper checks `$NOTIFY_SOCKET` itself).
sd-notify = "0.4"
# The linux binaries are static musl builds, so getaddrinfo is musl's
# resolver, which returns EAI_AGAIN when any of its parallel A/AAAA
# queries goes unanswered (and, on older bundled musl, on any truncated
# UDP answer) — real DNS environments trigger this while glibc tools on
# the same host resolve fine. hickory-dns swaps
# in a pure-Rust resolver for every reqwest client in the binary (feature
# unification covers the SDK's clients too). Linux-only on purpose: macOS
# and Windows keep their OS resolver.
reqwest = { version = "0.13", default-features = false, features = ["hickory-dns"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Brings the folder dialog to the front (see `bring_dialog_to_front` in
# commands/studio.rs). rfd raises a Prohibited process only as far as
# Accessory and never activates it — verified in its own
# backend/macos/utils/policy_manager.rs — so on a CLI daemon the panel
# can open BEHIND the browser, leaving the page waiting on a dialog
# nobody can see. Both crates are already in the tree via rfd, so this
# adds no compilation units, only a direct path to NSApplication.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSRunLoop", "NSDate"] }

[dev-dependencies]
tempfile = "3"
# Generates a throwaway CA at test runtime for the SDK CA-forwarding test, so
# no fixture is committed and nothing expires.
rcgen = "0.13"
# `test-util` enables tokio's paused clock (`start_paused`) used by the
# startup-stall watchdog tests. Merged with the `full` feature set from the
# main dependency above; not pulled into non-test builds.
tokio = { version = "1", features = ["test-util"] }
